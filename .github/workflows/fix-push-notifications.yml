name: Fix web push

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch admin and add service worker
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('admin.html')
          s = p.read_text()
          new_fn = '''async function enableNotifications(){if(!('Notification'in window)||!('serviceWorker'in navigator)||!('PushManager'in window)){alert('Этот браузер не поддерживает push-уведомления');return}try{const p=await Notification.requestPermission();if(p!=='granted'){ $('notifyMsg').textContent='Разрешение на уведомления не получено.';updateNotifyState();return}const reg=await navigator.serviceWorker.register('./sw.js');await navigator.serviceWorker.ready;let sub=await reg.pushManager.getSubscription();if(!sub){sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:'BDt0dc5xt2zssQLOaxid4iAtC3fekiiYOkh3B2r_WuLhm7Xu5I-xyqWErLcqoqaq701M3_0aX-WKEEhtZkWYWec'});}const j=sub.toJSON();if(!j.endpoint||!j.keys?.p256dh||!j.keys?.auth)throw new Error('Не удалось получить данные push-подписки');const r=await db.from('push_subscriptions').upsert({endpoint:j.endpoint,p256dh:j.keys.p256dh,auth:j.keys.auth,owner_id:OWNER,subscription:j,updated_at:new Date().toISOString()},{onConflict:'endpoint'});if(r.error)throw r.error;new Notification('Букет Шаров',{body:'Уведомления о новых заказах включены ✅'});$('notifyMsg').textContent='Готово. Push-подписка сохранена.';updateNotifyState()}catch(e){$('notifyMsg').textContent='Ошибка подключения уведомлений: '+(e?.message||e);console.error(e)}}'''
          s2, n = re.subn(r'async function enableNotifications\(\)\{.*?\}\s*updateNotifyState\(\)\}', new_fn, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('enableNotifications block not found')
          p.write_text(s2)
          Path('sw.js').write_text("""self.addEventListener('push',event=>{let data={};try{data=event.data?event.data.json():{}}catch(e){data={body:event.data?event.data.text():''}}event.waitUntil(self.registration.showNotification(data.title||'🔔 Букет Шаров',{body:data.body||'Новый заказ',data:{url:data.url||'./admin.html'}}))});self.addEventListener('notificationclick',event=>{event.notification.close();const url=event.notification.data?.url||'./admin.html';event.waitUntil(clients.matchAll({type:'window',includeUncontrolled:true}).then(list=>{for(const c of list){if('focus'in c)return c.focus()}return clients.openWindow(url)}))});""")
          PY
      - name: Commit changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add admin.html sw.js .github/workflows/fix-push-notifications.yml
          git commit -m "Enable real web push subscriptions" || exit 0
          git push
