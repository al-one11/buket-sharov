<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Уведомления — Букет Шаров</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#fbf7f4;color:#292322;margin:0;padding:24px}
.card{max-width:560px;margin:30px auto;background:#fff;padding:24px;border-radius:20px;border:1px solid #eadfda}
button{width:100%;padding:15px;border:0;border-radius:12px;background:#302827;color:#fff;font-size:16px;font-weight:700;margin-top:10px}
#msg{line-height:1.5;color:#746b68}
.status{margin:18px 0;padding:14px;background:#f8f3f0;border-radius:14px;line-height:1.7}
.ok{color:#16733a}.bad{color:#b3261e}.muted{color:#746b68}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="card">
<h1>🔔 Уведомления</h1>
<p>Проверка уведомлений для телефона владельца «Букет Шаров».</p>
<div id="status" class="status">Проверяем возможности браузера…</div>
<button id="btn">Проверить и подключить</button>
<p id="msg">После проверки здесь будет указано, на каком этапе возникла проблема.</p>
</div>
<script>
const SUPABASE_URL='https://vpkqcyseuvswydttojtc.supabase.co',
SUPABASE_KEY='sb_publishable_9C6hJq0sFUveQgMz1GTZAA_T5em69jN',
db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY),
OWNER='e8c95671-7549-4c4d-8210-951f63e8a257',
VAPID='BDt0dc5xt2zssQLOaxid4iAtC3fekiiYOkh3B2r_WuLhm7Xu5I-xyqWErLcqoqaq701M3_0aX-WKEEhtZkWYWec',
status=document.getElementById('status'),msg=document.getElementById('msg');

function showStatus(){
 const n='Notification' in window;
 const sw='serviceWorker' in navigator;
 const push='PushManager' in window;
 const perm=n?Notification.permission:'не поддерживается';
 status.innerHTML=
 '🔔 Уведомления браузера: <b class="'+(perm==='granted'?'ok':perm==='denied'?'bad':'muted')+'">'+perm+'</b><br>'+
 '⚙️ Service Worker: <b class="'+(sw?'ok':'bad')+'">'+(sw?'поддерживается':'не поддерживается')+'</b><br>'+
 '📱 Push API: <b class="'+(push?'ok':'bad')+'">'+(push?'поддерживается':'не поддерживается')+'</b>';
}
showStatus();

document.getElementById('btn').onclick=async()=>{
 try{
  showStatus();
  const {data:{session}}=await db.auth.getSession();
  if(!session){
   msg.textContent='Сначала войдите в админку «Букет Шаров» на этом же телефоне, затем снова откройте эту страницу.';
   return;
  }
  if(!('Notification'in window)||!('serviceWorker'in navigator)||!('PushManager'in window)){
   msg.textContent='Этот браузер не поддерживает необходимые функции Push.';
   return;
  }
  let permission=Notification.permission;
  if(permission!=='granted') permission=await Notification.requestPermission();
  showStatus();
  if(permission!=='granted'){
   msg.textContent='Браузер не выдал разрешение. Если здесь написано «denied», нужно разрешить уведомления для этого сайта в настройках Яндекс Браузера.';
   return;
  }
  const reg=await navigator.serviceWorker.register('./sw.js');
  await navigator.serviceWorker.ready;
  let sub=await reg.pushManager.getSubscription();
  if(!sub) sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:VAPID});
  const j=sub.toJSON();
  if(!j.endpoint||!j.keys||!j.keys.p256dh||!j.keys.auth) throw new Error('Не удалось получить данные push-подписки');
  const r=await db.from('push_subscriptions').upsert({
   endpoint:j.endpoint,p256dh:j.keys.p256dh,auth:j.keys.auth,owner_id:OWNER,subscription:j,updated_at:new Date().toISOString()
  },{onConflict:'endpoint'});
  if(r.error) throw r.error;
  await reg.showNotification('Букет Шаров',{body:'Уведомления подключены ✅'});
  msg.textContent='Готово! Push-подписка сохранена. Теперь можно сделать тестовый заказ.';
  document.getElementById('btn').textContent='✅ Подписка подключена';
 }catch(e){
  console.error(e);
  msg.textContent='Ошибка: '+(e&&e.message?e.message:e);
 }
};
</script>
</body>
</html>
