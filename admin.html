<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Букет Шаров — панель владельца</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#fbf7f4;color:#292322;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:760px;margin:auto;padding:20px}.card{background:#fff;border:1px solid #eadfda;border-radius:20px;padding:20px;margin:14px 0}input,button{width:100%;box-sizing:border-box;padding:13px;margin:6px 0;border-radius:12px;border:1px solid #ddd;font-size:16px}button{background:#302827;color:#fff;border:0;font-weight:700}.row{display:flex;gap:10px}.row>*{flex:1}.muted{color:#746b68;font-size:13px}.item{border-top:1px solid #eee;padding:14px 0}.item img{width:80px;height:80px;object-fit:cover;border-radius:10px;vertical-align:middle;margin-right:10px}.ok{color:#237a43}.err{color:#b3261e}</style></head><body><main class="wrap"><h1>Букет Шаров</h1><p class="muted">Панель владельца: добавление товаров и управление каталогом.</p><section id="login" class="card"><h2>Вход</h2><input id="email" type="email" value="Gabdrahimova_90@mail.ru"><input id="password" type="password" placeholder="Пароль"><button id="loginBtn">Войти</button><p id="loginMsg" class="muted"></p></section><section id="app" class="card" hidden><button id="logoutBtn">Выйти</button><h2>Добавить товар</h2><input id="name" placeholder="Название товара"><div class="row"><input id="price" type="number" min="0" placeholder="Цена, ₽"><input id="oldPrice" type="number" min="0" placeholder="Старая цена, ₽"></div><input id="category" value="Цветы" placeholder="Категория"><input id="photo" type="file" accept="image/jpeg,image/png,image/webp,image/*"><button id="addBtn">Добавить товар</button><p id="msg" class="muted"></p><h2>Каталог</h2><div id="list">Загрузка...</div></section></main><script>const SUPABASE_URL='https://vpkqcyseuvswydttojtc.supabase.co';const SUPABASE_KEY='sb_publishable_9C6hJq0sFUveQgMz1GTZAA_T5em69jN';const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const $=id=>document.getElementById(id);function setMsg(text,ok=false){$('msg').textContent=text;$('msg').className=ok?'muted ok':'muted err'}async function login(){const email=$('email').value.trim(),password=$('password').value;if(!email||!password){$('loginMsg').textContent='Введите email и пароль.';return}$('loginBtn').disabled=true;$('loginBtn').textContent='Вхожу...';const {error}=await db.auth.signInWithPassword({email,password});if(error){$('loginMsg').textContent='Ошибка входа: '+error.message;$('loginBtn').disabled=false;$('loginBtn').textContent='Войти';return}show()}async function logout(){await db.auth.signOut();location.reload()}function show(){$('login').hidden=true;$('app').hidden=false;load()}async function load(){const {data,error}=await db.from('products').select('*').order('sort_order').order('created_at',{ascending:false});if(error){$('list').textContent='Ошибка загрузки: '+error.message;return}$('list').innerHTML=data.length?data.map(p=>`<div class="item"><img src="${p.image_url||''}" alt=""><b>${esc(p.name)}</b><br>${Number(p.price).toLocaleString('ru-RU')} ₽ ${p.old_price?`<s>${Number(p.old_price).toLocaleString('ru-RU')} ₽</s>`:''}<br><button onclick="toggleProduct('${p.id}',${p.active})">${p.active?'Скрыть':'Показать'}</button></div>`).join(''):'Товаров пока нет'}async function addProduct(){const name=$('name').value.trim(),price=$('price').value,oldPrice=$('oldPrice').value,category=$('category').value.trim()||'Цветы',file=$('photo').files[0];if(!name||price===''||!file){setMsg('Нужно указать название, цену и выбрать фотографию.');return}if(!Number.isFinite(Number(price))||Number(price)<0){setMsg('Цена указана неверно.');return}const btn=$('addBtn');btn.disabled=true;btn.textContent='Загрузка...';setMsg('Загружаю фотографию...');try{const safe=file.name.replace(/[^a-zA-Z0-9._-]/g,'_');const path=crypto.randomUUID()+'-'+safe;const up=await db.storage.from('product-images').upload(path,file,{cacheControl:'3600',upsert:false});if(up.error)throw new Error('Ошибка загрузки фото: '+up.error.message);setMsg('Фото загружено. Сохраняю товар...');const pub=db.storage.from('product-images').getPublicUrl(path).data.publicUrl;const {error}=await db.from('products').insert({name,price:Number(price),old_price:oldPrice!==''?Number(oldPrice):null,category,image_path:path,image_url:pub,active:true});if(error)throw new Error('Фото загрузилось, но товар не сохранился: '+error.message);$('name').value='';$('price').value='';$('oldPrice').value='';$('photo').value='';setMsg('Товар успешно добавлен!',true);await load()}catch(e){setMsg(e.message||'Произошла ошибка.')}finally{btn.disabled=false;btn.textContent='Добавить товар'}}async function toggleProduct(id,active){const {error}=await db.from('products').update({active:!active}).eq('id',id);if(error)alert('Ошибка: '+error.message);else load()}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}$('loginBtn').addEventListener('click',login);$('logoutBtn').addEventListener('click',logout);$('addBtn').addEventListener('click',addProduct);db.auth.getSession().then(({data})=>{if(data.session)show()});</script></body></html>
