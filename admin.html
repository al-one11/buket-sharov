<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Букет Шаров — панель владельца</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#fbf7f4;color:#292322;font-family:Arial,sans-serif}.wrap{max-width:900px;margin:auto;padding:18px}.card,.item{background:#fff;border:1px solid #eadfda;border-radius:16px;padding:16px;margin:12px 0}.row{display:flex;gap:8px}.row>*{flex:1}input,select,textarea,button{box-sizing:border-box;width:100%;padding:11px;margin:5px 0;border-radius:10px;border:1px solid #ddd;font:inherit}button{background:#302827;color:#fff;border:0;font-weight:700;cursor:pointer}.save{background:#3b7d4f}.cancel{background:#eee;color:#292322}.danger{background:#a33}.move{width:48%;display:inline-block;background:#75606b}.muted{font-size:13px;color:#746b68}.item img{width:82px;height:82px;object-fit:cover;border-radius:10px;float:left;margin:0 12px 8px 0}.item:after{content:"";display:block;clear:both}.editbox{background:#faf7f5;border:1px solid #eadfda;border-radius:12px;padding:10px;margin-top:10px}.cat{font-size:13px;color:#756b67;font-weight:700}.order{border:1px solid #eadfda;border-radius:12px;padding:12px;margin:10px 0}.status{font-weight:700}</style></head><body><main class="wrap"><h1>Букет Шаров</h1><p class="muted">Панель владельца: каталог и заказы.</p><section id="login" class="card"><h2>Вход</h2><input id="email" type="email" value="Gabdrahimova_90@mail.ru"><input id="password" type="password" placeholder="Пароль"><button id="loginBtn">Войти</button><p id="loginMsg" class="muted"></p></section><section id="app" class="card" hidden><button id="logoutBtn">Выйти</button><h2>Заказы</h2><button id="refreshOrders">🔄 Обновить заказы</button><div id="orders">Загрузка...</div><h2>Добавить товар</h2><input id="name" placeholder="Название товара"><div class="row"><input id="price" type="number" min="0" placeholder="Цена, ₽"><input id="oldPrice" type="number" min="0" placeholder="Старая цена, ₽"></div><select id="category"><option>Букеты</option><option>Монобукеты</option><option>Шары</option><option>Сопутствующие товары</option></select><input id="photo" type="file" accept="image/*"><button id="addBtn">Добавить товар</button><p id="msg" class="muted"></p><h2>Каталог</h2><p class="muted">Кнопки ⬆️ и ⬇️ меняют порядок товаров внутри одной категории.</p><div id="list">Загрузка...</div></section></main><script>const URL='https://vpkqcyseuvswydttojtc.supabase.co',KEY='sb_publishable_9C6hJq0sFUveQgMz1GTZAA_T5em69jN',db=supabase.createClient(URL,KEY),$=id=>document.getElementById(id);let products=[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const cat=c=>{let s=String(c||'').toLowerCase();if(s.includes('моно'))return'Монобукеты';if(s.includes('шар'))return'Шары';if(s.includes('сопутств')||s.includes('подар'))return'Сопутствующие товары';return'Букеты'};async function login(){let r=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(r.error)$('loginMsg').textContent='Ошибка входа: '+r.error.message;else show()}function show(){$('login').hidden=true;$('app').hidden=false;load();loadOrders()}async function logout(){await db.auth.signOut();location.reload()}$('loginBtn').onclick=login;$('logoutBtn').onclick=logout;$('addBtn').onclick=addProduct;$('refreshOrders').onclick=loadOrders;async function load(){let r=await db.from('products').select('*').order('category').order('sort_order').order('created_at',{ascending:false});if(r.error){$('list').textContent=r.error.message;return}products=r.data||[];render()}function render(){$('list').innerHTML=products.length?products.map((p,i)=>{let same=products.filter(x=>cat(x.category)===cat(p.category)),pos=same.findIndex(x=>x.id===p.id);return `<div class="item"><img src="${esc(p.image_url||'')}"><b>${esc(p.name)}</b><br><span class="cat">${esc(cat(p.category))}</span><br>${Number(p.price).toLocaleString('ru-RU')} ₽ ${p.old_price?`<s>${Number(p.old_price).toLocaleString('ru-RU')} ₽</s>`:''}<br><button data-edit="${p.id}">✏️ Редактировать</button><button class="danger" data-delete="${p.id}">🗑 Удалить</button><button class="move" data-up="${p.id}" ${pos===0?'disabled':''}>⬆️ Вверх</button><button class="move" data-down="${p.id}" ${pos===same.length-1?'disabled':''}>⬇️ Вниз</button><div class="editbox" id="edit-${p.id}" hidden><input id="ename-${p.id}" value="${esc(p.name)}"><div class="row"><input id="eprice-${p.id}" type="number" min="0" value="${Number(p.price)}"><input id="eold-${p.id}" type="number" min="0" value="${p.old_price===null?'':Number(p.old_price)}"></div><select id="ecat-${p.id}"><option>Букеты</option><option>Монобукеты</option><option>Шары</option><option>Сопутствующие товары</option></select><label>Новая фотография:</label><input id="ephoto-${p.id}" type="file" accept="image/*"><button class="save" data-save="${p.id}">Сохранить изменения</button><button class="cancel" data-cancel="${p.id}">Отмена</button><p class="muted" id="emsg-${p.id}"></p></div></div>`}).join(''):'Товаров пока нет';products.forEach(p=>{let s=$('ecat-'+p.id);if(s)s.value=cat(p.category)});document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{$('edit-'+b.dataset.edit).hidden=!$('edit-'+b.dataset.edit).hidden});document.querySelectorAll('[data-cancel]').forEach(b=>b.onclick=()=>{$('edit-'+b.dataset.cancel).hidden=true});document.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>saveEdit(b.dataset.save));document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>deleteProduct(b.dataset.delete));document.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>moveProduct(b.dataset.up,-1));document.querySelectorAll('[data-down]').forEach(b=>b.onclick=()=>moveProduct(b.dataset.down,1))}async function upload(file){let safe=file.name.replace(/[^a-zA-Z0-9._-]/g,'_'),path=crypto.randomUUID()+'-'+safe,r=await db.storage.from('product-images').upload(path,file,{contentType:file.type||'image/jpeg'});if(r.error)throw new Error('Фото: '+r.error.message);return{path,url:db.storage.from('product-images').getPublicUrl(path).data.publicUrl}}async function saveEdit(id){let p=products.find(x=>x.id===id),name=$('ename-'+id).value.trim(),price=$('eprice-'+id).value,old=$('eold-'+id).value,category=$('ecat-'+id).value,file=$('ephoto-'+id).files[0],msg=$('emsg-'+id);if(!name||price===''){msg.textContent='Проверьте название и цену.';return}msg.textContent='Сохраняю…';let data={name,price:Number(price),old_price:old===''?null:Number(old),category,updated_at:new Date().toISOString()};try{if(file){let u=await upload(file);data.image_path=u.path;data.image_url=u.url;if(p.image_path)await db.storage.from('product-images').remove([p.image_path])}let r=await db.from('products').update(data).eq('id',id);if(r.error)throw new Error(r.error.message);await load()}catch(e){msg.textContent='Ошибка: '+e.message}}async function deleteProduct(id){let p=products.find(x=>x.id===id);if(!p||!confirm('Удалить товар «'+p.name+'» навсегда?'))return;let r=await db.from('products').delete().eq('id',id);if(r.error){alert('Ошибка удаления: '+r.error.message);return}if(p.image_path)await db.storage.from('product-images').remove([p.image_path]);await load()}async function moveProduct(id,dir){let p=products.find(x=>x.id===id);if(!p)return;let same=products.filter(x=>cat(x.category)===cat(p.category));same.sort((a,b)=>(a.sort_order??0)-(b.sort_order??0));let i=same.findIndex(x=>x.id===id),j=i+dir;if(j<0||j>=same.length)return;let a=same[i],b=same[j],ra=await db.from('products').update({sort_order:b.sort_order,updated_at:new Date().toISOString()}).eq('id',a.id),rb=await db.from('products').update({sort_order:a.sort_order,updated_at:new Date().toISOString()}).eq('id',b.id);if(ra.error||rb.error){alert((ra.error||rb.error).message);return}await load()}async function addProduct(){let name=$('name').value.trim(),price=$('price').value,old=$('oldPrice').value,category=$('category').value,file=$('photo').files[0];if(!name||price===''||!file){$('msg').textContent='Нужно указать название, цену и фото.';return}try{$('msg').textContent='Загружаю фото…';let u=await upload(file),r=await db.from('products').insert({name,price:Number(price),old_price:old===''?null:Number(old),category,image_path:u.path,image_url:u.url,active:true,sort_order:0});if(r.error)throw new Error(r.error.message);$('msg').textContent='Товар добавлен ✅';$('name').value='';$('price').value='';$('oldPrice').value='';$('photo').value='';await load()}catch(e){$('msg').textContent='Ошибка: '+e.message}}async function loadOrders(){let r=await db.from('orders').select('*').order('created_at',{ascending:false});if(r.error){$('orders').textContent=r.error.message;return}if(!r.data.length){$('orders').textContent='Новых заказов нет.';return}$('orders').innerHTML=r.data.map(o=>`<div class="order"><b>Заказ #${esc(o.id.slice(0,8).toUpperCase())}</b><br>${esc(o.customer_name)}<br>📞 ${esc(o.customer_phone)}<br>💰 ${Number(o.total).toLocaleString('ru-RU')} ₽<br><span class="status">${esc(o.status||'new')}</span><select onchange="changeStatus('${o.id}',this.value)"><option value="new">Новый</option><option value="confirmed">Подтверждён</option><option value="completed">Выполнен</option><option value="cancelled">Отменён</option></select></div>`).join('')}async function changeStatus(id,status){let r=await db.from('orders').update({status}).eq('id',id);if(r.error)alert(r.error.message);else loadOrders()}db.auth.getSession().then(({data})=>{if(data.session)show()})</script></body></html>
