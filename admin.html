<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Цветы Букет Шаров — панель владельца</title><style>
:root{--accent:#ff2f7d;--accent2:#ff6338;--ink:#351326;--muted:#79586a;--line:#f4bfd7}
body{margin:0;background:#fbf7f4;color:#292322;font-family:Arial,sans-serif}.wrap{max-width:900px;margin:auto;padding:18px}.card,.item{background:#fff;border:1px solid #eadfda;border-radius:16px;padding:16px;margin:12px 0}.row{display:flex;gap:8px}.row>*{flex:1}input,select,textarea,button{box-sizing:border-box;width:100%;padding:11px;margin:5px 0;border-radius:10px;border:1px solid #ddd;font:inherit}.admin-bg{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:-1;background:linear-gradient(135deg,#fff1f7,#fff9ef 48%,#f4edff)}.admin-bg span{position:absolute;border-radius:50%;filter:blur(2px);opacity:.25}.admin-bg span:nth-child(1){width:240px;height:240px;background:#ff8fba;top:-80px;right:-50px}.admin-bg span:nth-child(2){width:180px;height:180px;background:#ffd36e;bottom:12%;left:-70px}.admin-bg span:nth-child(3){width:140px;height:140px;background:#b89cff;top:42%;right:8%}.admin-header{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:20px 22px;background:rgba(255,255,255,.88);border:1px solid #f6c3da;border-radius:24px;box-shadow:0 14px 40px #6e514612;margin-bottom:8px}.brand{font:700 25px Georgia,serif;color:#8b1855;letter-spacing:-.02em}.brand small{display:block;font:700 9px Arial,sans-serif;letter-spacing:.12em;color:var(--muted);margin-top:6px}.brand-flower{width:48px;height:48px;border-radius:16px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-size:27px;box-shadow:0 10px 24px #ff2f7d33}.intro{margin:8px 4px 18px}.wrap{max-width:940px}.card,.item{box-shadow:0 8px 25px #6e51460b}.card h2{font-family:Georgia,serif;color:var(--ink)}button{background:linear-gradient(90deg,var(--accent),var(--accent2));color:#fff;border:0;font-weight:700;cursor:pointer}.save{background:#3b7d4f}.cancel{background:#eee;color:#292322}.danger{background:#a33}.move{width:48%;display:inline-block;background:#75606b}.admin-cats{display:flex;gap:8px;overflow:auto;padding:4px 0 12px;position:sticky;top:0;background:#fff;z-index:2}.admin-cat{width:auto;white-space:nowrap;padding:9px 14px;border-radius:999px;background:#f7efec;color:#5d504c}.admin-cat.active{background:linear-gradient(90deg,var(--accent),var(--accent2));color:#fff}.product-list{display:grid;gap:10px}.drag-hint{font-size:12px;color:#746b68;margin:0 0 10px}.drag-item{cursor:grab}.drag-item.dragging{opacity:.45}.drag-handle{font-size:20px;float:right;cursor:grab}.move-row{display:flex;gap:6px}.move-row button{margin:5px 0;width:50%}.muted{font-size:13px;color:#746b68}.item img{width:82px;height:82px;object-fit:cover;border-radius:10px;float:left;margin:0 12px 8px 0}.item:after{content:"";display:block;clear:both}.editbox{background:#faf7f5;border:1px solid #eadfda;border-radius:12px;padding:10px;margin-top:10px}.cat{font-size:13px;color:#756b67;font-weight:700}.order{border:1px solid #eadfda;border-radius:12px;padding:12px;margin:10px 0}.status{font-weight:700}</style></head><body>
<div class="admin-bg"><span></span><span></span><span></span></div>
<main class="wrap">
<header class="admin-header">
  <div class="brand"><div>ЦВЕТЫ БУКЕТ ШАРОВ</div><small>ПАНЕЛЬ ВЛАДЕЛЬЦА • ЦВЕТЫ • ШАРЫ • ПОДАРКИ</small></div>
  <div class="brand-flower">✿</div>
</header>
<p class="muted intro">Управляйте каталогом и заказами в одном месте.</p><section id="login" class="card"><h2>Вход</h2><input id="email" type="email" value="Gabdrahimova_90@mail.ru"><input id="password" type="password" autocomplete="current-password" placeholder="Пароль"><button id="loginBtn" type="button">Войти</button><p id="loginMsg" class="muted"></p></section><section id="app" class="card" hidden><button id="logoutBtn">Выйти</button><h2>Заказы</h2><button id="refreshOrders">🔄 Обновить заказы</button><div id="orders">Загрузка...</div><h2>Добавить товар</h2><input id="name" placeholder="Название товара"><div class="row"><input id="price" type="number" min="0" placeholder="Цена, ₽"><input id="oldPrice" type="number" min="0" placeholder="Старая цена, ₽"></div><select id="category"><option>Букеты</option><option>Монобукеты</option><option>Композиции</option><option>Шары</option><option>Сопутствующие товары</option></select><input id="photo" type="file" accept="image/*"><button id="addBtn">Добавить товар</button><p id="msg" class="muted"></p><h2>Каталог</h2><div id="adminCats" class="admin-cats"></div><p class="drag-hint">Выберите раздел. На компьютере товары можно перетаскивать, а на телефоне удобно менять порядок кнопками ⬆️⬇️.</p><div id="list" class="product-list">Загрузка...</div></section></main><script>
(function(){
var URL="https://vpkqcyseuvswydttojtc.supabase.co";
var KEY="sb_publishable_9C6hJq0sFUveQgMz1GTZAA_T5em69jN";
var token=null, products=[],selectedCategory="Букеты";
function $(id){return document.getElementById(id)}
function headers(){var h={"apikey":KEY};if(token)h.Authorization="Bearer "+token;return h}
async function request(path,method,body){
 var h=headers(); if(body!==undefined){h["Content-Type"]="application/json";h.Prefer="return=minimal"}
 var r=await fetch(URL+path,{method:method||"GET",headers:h,body:body===undefined?undefined:JSON.stringify(body)});
 var text=await r.text(),data;try{data=JSON.parse(text)}catch(e){data=text}
 if(!r.ok)throw new Error((data&&data.message)||"HTTP "+r.status);
 return data;
}
function escapeHtml(v){return String(v==null?"":v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
async function login(){
 var b=$("loginBtn"),m=$("loginMsg");b.disabled=true;m.textContent="Входим...";
 try{
  var r=await request("/auth/v1/token?grant_type=password","POST",{email:$("email").value.trim(),password:$("password").value});
  token=r.access_token;localStorage.setItem("bs_access",token);openApp();
 }catch(e){m.textContent="Ошибка входа: "+e.message}finally{b.disabled=false}
}
function openApp(){$("login").hidden=true;$("app").hidden=false;loadProducts();loadOrders()}
function logout(){localStorage.removeItem("bs_access");location.reload()}
async function loadProducts(){
 try{products=await request("/rest/v1/products?select=*&order=category.asc,sort_order.asc,created_at.desc");renderProducts()}catch(e){$("list").textContent="Ошибка каталога: "+e.message}
}
function renderProducts(){
 renderAdminCats();
 var visible=products.filter(function(p){return String(p.category||"Букеты")===selectedCategory});
 if(!visible.length){$("list").textContent="В этом разделе пока нет товаров";return}
 var out="";
 for(var i=0;i<visible.length;i++){
  var p=visible[i];
  out+='<div class="item drag-item" draggable="true" data-product-id="'+p.id+'"><span class="drag-handle">☷</span><img src="'+escapeHtml(p.image_url||"")+'"><b>'+escapeHtml(p.name)+'</b><br>'+escapeHtml(p.category||"Букеты")+'<br>'+Number(p.price).toLocaleString("ru-RU")+' ₽<div class="move-row"><button data-up="'+p.id+'">⬆️ Выше</button><button data-down="'+p.id+'">⬇️ Ниже</button></div><button data-edit="'+p.id+'">✏️ Редактировать</button> <button class="danger" data-delete="'+p.id+'">🗑 Удалить</button></div>';
 }
 $("list").innerHTML=out;
 document.querySelectorAll("[data-delete]").forEach(function(b){b.onclick=function(){deleteProduct(b.getAttribute("data-delete"))}});
 document.querySelectorAll("[data-edit]").forEach(function(b){b.onclick=function(){editProduct(b.getAttribute("data-edit"))}});
 document.querySelectorAll("[data-up]").forEach(function(b){b.onclick=function(){moveProduct(b.getAttribute("data-up"),-1)}});
 document.querySelectorAll("[data-down]").forEach(function(b){b.onclick=function(){moveProduct(b.getAttribute("data-down"),1)}});
 var dragged=null;
 document.querySelectorAll(".drag-item").forEach(function(el){
  el.addEventListener("dragstart",function(){dragged=el;el.classList.add("dragging")});
  el.addEventListener("dragend",function(){el.classList.remove("dragging");dragged=null});
  el.addEventListener("dragover",function(e){e.preventDefault()});
  el.addEventListener("drop",async function(e){
   e.preventDefault();if(!dragged||dragged===el)return;
   var ids=Array.from(document.querySelectorAll(".drag-item")).map(function(x){return x.getAttribute("data-product-id")});
   var from=ids.indexOf(dragged.getAttribute("data-product-id")),to=ids.indexOf(el.getAttribute("data-product-id"));
   if(from<0||to<0)return;
   ids.splice(from,1);ids.splice(to,0,dragged.getAttribute("data-product-id"));
   try{await saveCategoryOrder(ids)}catch(err){alert("Не удалось сохранить порядок: "+err.message)}
  });
 });
}
function renderAdminCats(){
 var cats=["Букеты","Монобукеты","Композиции","Шары","Сопутствующие товары"];
 $("adminCats").innerHTML=cats.map(function(c){return '<button type="button" class="admin-cat '+(c===selectedCategory?"active":"")+'" data-admin-cat="'+escapeHtml(c)+'">'+escapeHtml(c)+'</button>'}).join("");
 document.querySelectorAll("[data-admin-cat]").forEach(function(b){b.onclick=function(){selectedCategory=b.getAttribute("data-admin-cat");renderProducts()}});
}
async function saveCategoryOrder(ids){
 for(var i=0;i<ids.length;i++){
  await request("/rest/v1/products?id=eq."+encodeURIComponent(ids[i]),"PATCH",{sort_order:i});
 }
 await loadProducts();
}
async function moveProduct(id,dir){
 var index=products.findIndex(function(x){return String(x.id)===String(id)});
 if(index<0)return;
 var p=products[index], targetIndex=index+dir;
 while(targetIndex>=0 && targetIndex<products.length && String(products[targetIndex].category||"")!==String(p.category||"")) targetIndex+=dir;
 if(targetIndex<0 || targetIndex>=products.length || String(products[targetIndex].category||"")!==String(p.category||""))return;
 var target=products[targetIndex];
 var a=Number(p.sort_order||0), b=Number(target.sort_order||0);
 try{
  var patch1={sort_order:b}, patch2={sort_order:a};
  await request("/rest/v1/products?id=eq."+encodeURIComponent(p.id),"PATCH",patch1);
  await request("/rest/v1/products?id=eq."+encodeURIComponent(target.id),"PATCH",patch2);
  await loadProducts();
 }catch(e){alert("Не удалось поменять порядок: "+e.message)}
}
async function uploadProductImage(file){var clean=file.name.replace(/[^a-zA-Z0-9._-]/g,"_"),path=Date.now()+"-"+Math.random().toString(36).slice(2)+"-"+clean;var h={"apikey":KEY,"Authorization":"Bearer "+token,"x-upsert":"false","Content-Type":file.type||"image/jpeg"};var r=await fetch(URL+"/storage/v1/object/product-images/"+encodeURIComponent(path),{method:"POST",headers:h,body:file});var t=await r.text();if(!r.ok){var d;try{d=JSON.parse(t)}catch(e){}throw new Error((d&&d.message)||t||("HTTP "+r.status))}return {path:path,url:URL+"/storage/v1/object/public/product-images/"+path}}
async function editProduct(id){
 var p=products.find(function(x){return String(x.id)===String(id)});if(!p)return;
 var box=document.createElement("div");box.className="editbox";box.innerHTML='<input id="en_'+id+'" value="'+escapeHtml(p.name)+'" placeholder="Название"><div class="row"><input id="ep_'+id+'" type="number" min="0" value="'+Number(p.price||0)+'" placeholder="Цена"><input id="eo_'+id+'" type="number" min="0" value="'+Number(p.old_price||0)+'" placeholder="Старая цена"></div><select id="ec_'+id+'"><option>Букеты</option><option>Монобукеты</option><option>Композиции</option><option>Шары</option><option>Сопутствующие товары</option></select><label class="muted">Новое фото (необязательно)</label><input id="ef_'+id+'" type="file" accept="image/*"><button class="save" id="es_'+id+'">Сохранить</button><button class="cancel" id="ex_'+id+'">Отмена</button><p id="em_'+id+'" class="muted"></p>';
 var item=document.querySelector('[data-edit="'+id+'"]').parentElement;item.appendChild(box);$("ec_"+id).value=p.category||"Букеты";$("es_"+id).onclick=async function(){var m=$("em_"+id);m.textContent="Сохраняем...";try{var patch={name:$("en_"+id).value.trim(),price:Number($("ep_"+id).value),old_price:Number($("eo_"+id).value)||null,category:$("ec_"+id).value};var file=$("ef_"+id).files[0];if(file){m.textContent="Загружаю новое фото...";var up=await uploadProductImage(file);patch.image_path=up.path;patch.image_url=up.url}await request("/rest/v1/products?id=eq."+encodeURIComponent(id),"PATCH",patch);await loadProducts()}catch(e){m.textContent="Ошибка: "+e.message}};$("ex_"+id).onclick=function(){box.remove()};
}
async function deleteProduct(id){
 var p=products.find(function(x){return String(x.id)===String(id)});if(!p||!confirm("Удалить товар?"))return;
 try{await request("/rest/v1/products?id=eq."+encodeURIComponent(id),"DELETE");loadProducts()}catch(e){alert(e.message)}
}
async function loadOrders(){
 try{
  var r=await request("/rest/v1/orders?select=*&order=created_at.desc");
  if(!r.length){$("orders").innerHTML='<div class="muted">История заказов пока пустая.</div>';return}
  var ids=r.map(function(o){return o.id});
  var items=[];
  if(ids.length){
   items=await request("/rest/v1/order_items?select=order_id,product_name,price,quantity&order=created_at.asc");
  }
  var byOrder={};
  items.forEach(function(x){(byOrder[x.order_id]||(byOrder[x.order_id]=[])).push(x)});
  var statusLabel={new:"Новый",confirmed:"Подтверждён",completed:"Выполнен",cancelled:"Отменён"};
  var out='<div class="muted" style="margin:4px 0 12px">Всего заказов: <b>'+r.length+'</b></div>';
  r.forEach(function(o){
   var list=byOrder[o.id]||[];
   var created=new Date(o.created_at).toLocaleString("ru-RU",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"});
   var number=String(o.id).slice(0,8).toUpperCase();
   var productsHtml=list.length?'<ul style="margin:8px 0 10px;padding-left:20px">'+list.map(function(x){return '<li>'+escapeHtml(x.product_name)+' × '+Number(x.quantity||0)+' — '+Number(x.price||0).toLocaleString("ru-RU")+' ₽</li>'}).join("")+'</ul>':'<div class="muted">Состав заказа не найден</div>';
   var address=o.delivery_address?'<div><b>Адрес:</b> '+escapeHtml(o.delivery_address)+'</div>':'';
   var comment=o.comment?'<div><b>Комментарий:</b> '+escapeHtml(o.comment)+'</div>':'';
   var bonus=Number(o.bonus_spent||0);
   out+='<div class="order"><div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start"><div><b>Заказ #'+number+'</b><div class="muted">'+created+'</div></div><b>'+Number(o.total||0).toLocaleString("ru-RU")+' ₽</b></div><hr style="border:0;border-top:1px solid #eadfda;margin:10px 0"><div><b>'+escapeHtml(o.customer_name||"Без имени")+'</b> · <a href="tel:'+escapeHtml(o.customer_phone||"")+'">'+escapeHtml(o.customer_phone||"")+'</a></div>'+address+comment+(bonus?'<div class="muted">Бонусами списано: '+bonus.toLocaleString("ru-RU")+' ₽</div>':'')+productsHtml+'<div style="display:flex;gap:6px;flex-wrap:wrap"><select data-status="'+escapeHtml(o.id)+'" style="width:auto;min-width:170px;margin:5px 0"><option value="new">Новый</option><option value="confirmed">Подтверждён</option><option value="completed">Выполнен</option><option value="cancelled">Отменён</option></select><button type="button" data-status-save="'+escapeHtml(o.id)+'" style="width:auto">Сохранить статус</button></div><div class="muted">Статус: '+escapeHtml(statusLabel[o.status]||o.status||"Не указан")+'</div></div>';
  });
  $("orders").innerHTML=out;
  r.forEach(function(o){var s=document.querySelector('[data-status="'+o.id+'"]');if(s)s.value=o.status||"new"});
  document.querySelectorAll("[data-status-save]").forEach(function(b){b.onclick=async function(){var id=b.getAttribute("data-status-save"),s=document.querySelector('[data-status="'+id+'"]');b.disabled=true;try{await request("/rest/v1/orders?id=eq."+encodeURIComponent(id),"PATCH",{status:s.value});await loadOrders()}catch(e){alert("Не удалось изменить статус: "+e.message)}finally{b.disabled=false}}});
 }catch(e){$("orders").innerHTML='<div class="muted">Ошибка заказов: '+escapeHtml(e.message)+'</div>'}
}
$("loginBtn").onclick=login;$("logoutBtn").onclick=logout;$("refreshOrders").onclick=loadOrders;
var saved=localStorage.getItem("bs_access");if(saved){token=saved;openApp()}
})();
</script></body></html>
