<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Букет Шаров — панель владельца</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#fbf7f4;color:#292322;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:850px;margin:auto;padding:20px}.card{background:#fff;border:1px solid #eadfda;border-radius:20px;padding:20px;margin:14px 0}input,select,textarea,button{width:100%;box-sizing:border-box;padding:13px;margin:6px 0;border-radius:12px;border:1px solid #ddd;font-size:16px}button{background:#302827;color:#fff;border:0;font-weight:700}.row{display:flex;gap:10px}.row>*{flex:1}.muted{color:#746b68;font-size:13px}.item{border-top:1px solid #eee;padding:14px 0}.item img{width:80px;height:80px;object-fit:cover;border-radius:10px;vertical-align:middle;margin-right:10px}.editbox{background:#faf7f5;border:1px solid #eadfda;border-radius:14px;padding:12px;margin-top:10px}.cancel{background:#eee;color:#292322}.save{background:#3b7d4f}.cat{font-size:14px;font-weight:700;color:#756b67}.hint{background:#f3e6e2;padding:12px;border-radius:12px;font-size:13px;line-height:1.4}.order{border:1px solid #eadfda;border-radius:16px;padding:15px;margin:12px 0;background:#fff}.order-head{display:flex;justify-content:space-between;gap:10px;align-items:center}.status{font-weight:700}.status.new{color:#a56b18}.status.confirmed{color:#3b7d4f}.status.done{color:#555}.status.cancelled{color:#a33}.order-items{background:#faf7f5;border-radius:12px;padding:10px;margin-top:10px}.small{font-size:13px;color:#746b68;line-height:1.55}</style></head><body><main class="wrap"><h1>Букет Шаров</h1><p class="muted">Панель владельца: каталог и заказы.</p><section id="login" class="card"><h2>Вход</h2><input id="email" type="email" value="Gabdrahimova_90@mail.ru"><input id="password" type="password" placeholder="Пароль"><button id="loginBtn">Войти</button><p id="loginMsg" class="muted"></p></section><section id="app" class="card" hidden><button id="logoutBtn">Выйти</button><h2>Заказы</h2><button id="refreshOrders" class="light">🔄 Обновить заказы</button><div id="orders">Загрузка...</div><h2>Добавить товар</h2><input id="name" placeholder="Название товара"><div class="row"><input id="price" type="number" min="0" placeholder="Цена, ₽"><input id="oldPrice" type="number" min="0" placeholder="Старая цена, ₽"></div><select id="category"><option>Букеты</option><option>Монобукеты</option><option>Шары</option><option>Сопутствующие товары</option></select><p class="hint">Выберите раздел каталога. Товар автоматически появится в выбранном разделе на сайте.</p><input id="photo" type="file" accept="image/*"><button id="addBtn">Добавить товар</button><p id="msg" class="muted"></p><h2>Каталог</h2><div id="list">Загрузка...</div></section></main><script>const SUPABASE_URL='https://vpkqcyseuvswydttojtc.supabase.co',SUPABASE_KEY='sb_publishable_9C6hJq0sFUveQgMz1GTZAA_T5em69jN',db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY),OWNER='e8c95671-7549-4c4d-8210-951f63e8a257';const $=id=>document.getElementById(id);$('loginBtn').onclick=login;$('logoutBtn').onclick=logout;$('addBtn').onclick=addProduct;$('refreshOrders').onclick=loadOrders;async function login(){const{error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){$('loginMsg').textContent='Ошибка входа: '+error.message;return}show()}async function logout(){await db.auth.signOut();location.reload()}function show(){$('login').hidden=true;$('app').hidden=false;load();loadOrders()}function normalizeCategory(c){const s=String(c||'').toLowerCase();if(s.includes('моно'))return'Монобукеты';if(s.includes('шар'))return'Шары';if(s.includes('сопутств')||s.includes('подар'))return'Сопутствующие товары';return'Букеты'}function esc(s){return String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]))}function attr(s){return esc(s)}async function loadOrders(){const box=$('orders');box.textContent='Загрузка...';const r=await db.from('orders').select('*').order('created_at',{ascending:false});if(r.error){box.textContent='Ошибка: '+r.error.message;return}if(!r.data.length){box.innerHTML='<p class="muted">Заказов пока нет.</p>';return}const ids=r.data.map(x=>x.id);const ir=await db.from('order_items').select('*').in('order_id',ids);const items=ir.data||[];box.innerHTML=r.data.map(o=>{const oi=items.filter(x=>x.order_id===o.id);const status=o.status||'new';return `<div class="order"><div class="order-head"><b>Заказ #${esc(o.id.slice(0,8).toUpperCase())}</b><span class="status ${esc(status)}">${statusText(status)}</span></div><div class="small">${new Date(o.created_at).toLocaleString('ru-RU')}<br>👤 ${esc(o.customer_name)}<br>📞 <a href="tel:${esc(o.customer_phone)}">${esc(o.customer_phone)}</a>${o.delivery_address?'<br>📍 '+esc(o.delivery_address):''}${o.comment?'<br>💬 '+esc(o.comment):''}</div><div class="order-items">${oi.length?oi.map(x=>`${esc(x.product_name)} — ${x.quantity} × ${Number(x.price).toLocaleString('ru-RU')} ₽`).join('<br>'):'Позиции не найдены'}</div><p><b>Итого: ${Number(o.total).toLocaleString('ru-RU')} ₽</b></p><select onchange="changeStatus('${esc(o.id)}',this.value)"><option value="new" ${status==='new'?'selected':''}>Новый</option><option value="confirmed" ${status==='confirmed'?'selected':''}>Подтверждён</option><option value="done" ${status==='done'?'selected':''}>Выполнен</option><option value="cancelled" ${status==='cancelled'?'selected':''}>Отменён</option></select></div>`}).join('')}function statusText(s){return({new:'Новый',confirmed:'Подтверждён',done:'Выполнен',cancelled:'Отменён'})[s]||s}async function changeStatus(id,status){const r=await db.from('orders').update({status}).eq('id',id);if(r.error)alert('Ошибка: '+r.error.message);else loadOrders()}async function load(){const r=await db.from('products').select('*').order('sort_order').order('created_at',{ascending:false});if(r.error){$('list').textContent=r.error.message;return}window.catalogProducts=r.data||[];$('list').innerHTML=r.data.length?r.data.map(p=>`<div class="item"><img src="${p.image_url||''}"><b>${esc(p.name)}</b><br><span class="cat">${esc(p.category||'Букеты')}</span><br>${Number(p.price).toLocaleString('ru-RU')} ₽ ${p.old_price?`<s>${Number(p.old_price).toLocaleString('ru-RU')} ₽</s>`:''}<br><button type="button" data-edit-id="${p.id}">✏️ Редактировать</button><button type="button" data-toggle-id="${p.id}" data-active="${p.active}">${p.active?'Скрыть':'Показать'}</button><div id="edit-${p.id}" class="editbox" hidden><input id="ename-${p.id}" value="${attr(p.name)}"><div class="row"><input id="eprice-${p.id}" type="number" min="0" value="${Number(p.price)}"><input id="eold-${p.id}" type="number" min="0" value="${p.old_price===null?'':Number(p.old_price)}"></div><select id="ecat-${p.id}"><option>Букеты</option><option>Монобукеты</option><option>Шары</option><option>Сопутствующие товары</option></select><button class="save" type="button" data-save-id="${p.id}">Сохранить изменения</button><button class="cancel" type="button" data-cancel-id="${p.id}">Отмена</button><p id="emsg-${p.id}" class="muted"></p></div></div>`).join(''):'Товаров пока нет';r.data.forEach(p=>{const c=$('ecat-'+p.id);if(c)c.value=normalizeCategory(p.category)});document.querySelectorAll('[data-edit-id]').forEach(b=>b.onclick=()=>{const x=$('edit-'+b.dataset.editId);x.hidden=!x.hidden});document.querySelectorAll('[data-cancel-id]').forEach(b=>b.onclick=()=>{$('edit-'+b.dataset.cancelId).hidden=true});document.querySelectorAll('[data-save-id]').forEach(b=>b.onclick=()=>saveEdit(b.dataset.saveId));document.querySelectorAll('[data-toggle-id]').forEach(b=>b.onclick=()=>toggleProduct(b.dataset.toggleId,b.dataset.active==='true'))}async function saveEdit(id){const name=$('ename-'+id).value.trim(),price=$('eprice-'+id).value,old=$('eold-'+id).value,category=$('ecat-'+id).value,msg=$('emsg-'+id),pp=Number(price),po=old.trim()===''?null:Number(old);if(!name||price===''||Number.isNaN(pp)||pp<0){msg.textContent='Проверьте название и цену.';return}msg.textContent='Сохраняю…';const r=await db.from('products').update({name,price:pp,old_price:po,category,updated_at:new Date().toISOString()}).eq('id',id);if(r.error){msg.textContent='Ошибка: '+r.error.message;return}load()}async function addProduct(){const name=$('name').value.trim(),price=$('price').value,oldPrice=$('oldPrice').value,category=$('category').value,file=$('photo').files&&$('photo').files[0];if(!name||price===''||!file){$('msg').textContent='Нужно указать название, цену и выбрать фото.';return}$('addBtn').disabled=true;$('msg').textContent='Загружаю фотографию…';try{const safe=file.name.replace(/[^a-zA-Z0-9._-]/g,'_'),path=crypto.randomUUID()+'-'+safe,up=await db.storage.from('product-images').upload(path,file,{contentType:file.type||'image/jpeg',upsert:false});if(up.error)throw new Error('Фото: '+up.error.message);const pub=db.storage.from('product-images').getPublicUrl(path).data.publicUrl;const r=await db.from('products').insert({name,price:Number(price),old_price:oldPrice===''?null:Number(oldPrice),category,image_path:path,image_url:pub,active:true});if(r.error)throw new Error('Товар: '+r.error.message);$('name').value='';$('price').value='';$('oldPrice').value='';$('photo').value='';$('msg').textContent='Товар добавлен ✅';load()}catch(e){$('msg').textContent='Ошибка: '+e.message}finally{$('addBtn').disabled=false}}async function toggleProduct(id,active){const r=await db.from('products').update({active:!active,updated_at:new Date().toISOString()}).eq('id',id);if(r.error)alert(r.error.message);else load()}db.auth.getSession().then(({data})=>{if(data.session)show()})</script></body></html>
