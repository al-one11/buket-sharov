<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Букет Шаров — админка</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#fbf7f4;color:#292322;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:760px;margin:auto;padding:20px}.card{background:#fff;border:1px solid #eadfda;border-radius:20px;padding:20px;margin:14px 0}input,select,button{width:100%;box-sizing:border-box;padding:13px;margin:6px 0;border-radius:12px;border:1px solid #ddd;font-size:16px}button{background:#302827;color:#fff;border:0;font-weight:700}.row{display:flex;gap:10px}.row>*{flex:1}.muted{color:#746b68;font-size:13px}.item{border-top:1px solid #eee;padding:14px 0}.item img{width:80px;height:80px;object-fit:cover;border-radius:10px;vertical-align:middle;margin-right:10px}.editbox{background:#faf7f5;border:1px solid #eadfda;border-radius:14px;padding:12px;margin-top:10px}.cancel{background:#eee;color:#292322}.save{background:#3b7d4f}.cat{display:inline-block;background:#f3e6e2;border-radius:99px;padding:5px 9px;font-size:12px;margin:5px 0}</style></head><body><main class="wrap"><h1>Букет Шаров</h1><p class="muted">Добавляйте товары, выбирайте раздел каталога и меняйте данные без удаления товара.</p><section id="login" class="card"><h2>Вход</h2><input id="email" type="email" value="Gabdrahimova_90@mail.ru"><input id="password" type="password" placeholder="Пароль"><button id="loginBtn">Войти</button><p id="loginMsg" class="muted"></p></section><section id="app" class="card" hidden><button id="logoutBtn">Выйти</button><h2>Добавить товар</h2><input id="name" placeholder="Название товара"><div class="row"><input id="price" type="number" min="0" placeholder="Цена, ₽"><input id="oldPrice" type="number" min="0" placeholder="Старая цена, ₽"></div><select id="category"><option>Букеты</option><option>Монобукеты</option><option>Шары</option><option>Сопутствующие товары</option></select><input id="photo" type="file" accept="image/*"><button id="addBtn">Добавить товар</button><p id="msg" class="muted"></p><h2>Каталог</h2><div id="list">Загрузка...</div></section></main><script>const U='https://vpkqcyseuvswydttojtc.supabase.co',K='sb_publishable_9C6hJq0sFUveQgMz1GTZAA_T5em69jN',db=supabase.createClient(U,K),$=id=>document.getElementById(id),cats=['Букеты','Монобукеты','Шары','Сопутствующие товары'];function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function attr(s){return esc(s)}$('loginBtn').onclick=login;$('logoutBtn').onclick=()=>db.auth.signOut().then(()=>location.reload());$('addBtn').onclick=add;async function login(){let r=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(r.error){$('loginMsg').textContent='Ошибка входа: '+r.error.message;return}show()}function show(){$('login').hidden=true;$('app').hidden=false;load()}async function load(){let r=await db.from('products').select('*').order('sort_order').order('created_at',{ascending:false});if(r.error){$('list').textContent=r.error.message;return}let d=r.data||[];$('list').innerHTML=d.length?d.map(p=>{let opts=cats.map(c=>`<option ${p.category===c?'selected':''}>${c}</option>`).join('');return `<div class="item"><img src="${attr(p.image_url||'')}"><b>${esc(p.name)}</b><div><span class="cat">${esc(p.category||'Букеты')}</span></div><div>${Number(p.price).toLocaleString('ru-RU')} ₽ ${p.old_price?`<s>${Number(p.old_price).toLocaleString('ru-RU')} ₽</s>`:''}</div><button type="button" onclick="openEdit('${p.id}')">✏️ Редактировать</button><button type="button" onclick="toggle('${p.id}',${!!p.active})">${p.active?'Скрыть':'Показать'}</button><div id="edit-${p.id}" class="editbox" hidden><input id="n-${p.id}" value="${attr(p.name)}" placeholder="Название"><div class="row"><input id="p-${p.id}" type="number" min="0" value="${Number(p.price)}" placeholder="Цена, ₽"><input id="o-${p.id}" type="number" min="0" value="${p.old_price==null?'':Number(p.old_price)}" placeholder="Старая цена, ₽"></div><select id="c-${p.id}">${opts}</select><button class="save" type="button" onclick="saveEdit('${p.id}')">Сохранить изменения</button><button class="cancel" type="button" onclick="document.getElementById('edit-${p.id}').hidden=true">Отмена</button><p id="m-${p.id}" class="muted"></p></div></div>`}).join(''):'Товаров пока нет'}window.openEdit=id=>{let b=$('edit-'+id);b.hidden=!b.hidden};window.toggle=async(id,a)=>{let r=await db.from('products').update({active:!a,updated_at:new Date().toISOString()}).eq('id',id);if(r.error)alert(r.error.message);else load()};window.saveEdit=async id=>{let name=$('n-'+id).value.trim(),price=$('p-'+id).value,old=$('o-'+id).value,category=$('c-'+id).value,msg=$('m-'+id);if(!name||price===''){msg.textContent='Укажите название и цену';return}msg.textContent='Сохраняю…';let r=await db.from('products').update({name,price:Number(price),old_price:old===''?null:Number(old),category,updated_at:new Date().toISOString()}).eq('id',id);if(r.error){msg.textContent='Ошибка: '+r.error.message;return}load()};async function add(){let name=$('name').value.trim(),price=$('price').value,old=$('oldPrice').value,category=$('category').value,file=$('photo').files[0];if(!name||price===''||!file){$('msg').textContent='Нужно указать название, цену и фото';return}$('addBtn').disabled=true;$('msg').textContent='Загружаю фото…';try{let path=crypto.randomUUID()+'-'+file.name.replace(/[^a-zA-Z0-9._-]/g,'_'),up=await db.storage.from('product-images').upload(path,file,{contentType:file.type||'image/jpeg'});if(up.error)throw new Error(up.error.message);let url=db.storage.from('product-images').getPublicUrl(path).data.publicUrl,r=await db.from('products').insert({name,price:Number(price),old_price:old===''?null:Number(old),category,image_path:path,image_url:url,active:true});if(r.error)throw new Error(r.error.message);$('name').value='';$('price').value='';$('oldPrice').value='';$('photo').value='';$('msg').textContent='Товар добавлен ✅';load()}catch(e){$('msg').textContent='Ошибка: '+e.message}finally{$('addBtn').disabled=false}}db.auth.getSession().then(({data})=>{if(data.session)show()});</script></body></html>
